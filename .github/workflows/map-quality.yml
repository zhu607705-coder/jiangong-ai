name: Map workspace quality
on:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['.ci-transfer/**', '.github/workflows/apply-reviewed-map.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: map-quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python runtime
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Unit and contract tests
        run: npm test
      - name: Python and spatial tests
        if: always()
        run: npm run test:python
      - name: Type check and production build
        if: always()
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Offline full-application map interaction checks
        run: |
          if test -f tests/browser/map-workspace.mjs; then node tests/browser/map-workspace.mjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-ui-review
          path: |
            output/playwright/minimal-map-*.png
            output/playwright/minimal-map-check.json
          if-no-files-found: ignore
          retention-days: 7
