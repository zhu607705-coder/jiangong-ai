name: Map workspace quality
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: map-quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source for reproducibility
        run: git archive --format=tar.gz --output=/tmp/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: /tmp/source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python runtime
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Package offline verification dependencies
        run: |
          mkdir -p /tmp/verification
          cp $(command -v node) /tmp/verification/node
          tar czf /tmp/verification/node_modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: verification-dependencies
          path: /tmp/verification/
          retention-days: 1
      - name: Unit and contract tests
        run: npm test
      - name: Type check and build
        if: always()
        run: npm run build
      - name: Python tests
        if: always()
        run: npm run test:python
