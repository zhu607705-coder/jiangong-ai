name: Notice reading review
on:
  push:
    branches: [codex/notice-reading]
  pull_request:
    paths:
      - 'apps/host/intelligence*'
      - 'apps/workspace/src/intelligence/**'
      - 'packages/intelligence/notice-view.ts'
      - 'tests/**/notice*'
      - '.github/workflows/notice-reading.yml'
permissions:
  contents: read
concurrency:
  group: notice-reading-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve the exact tracked test input
        run: git archive --format=tar.gz --output=/tmp/notice-reading-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: notice-reading-source-${{ github.sha }}
          path: /tmp/notice-reading-source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Existing intelligence browser baseline
        run: node tests/browser/intelligence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notice-reading-browser
          path: output/playwright/intelligence-*
          if-no-files-found: ignore
          retention-days: 7
