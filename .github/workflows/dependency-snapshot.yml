name: GIS verification dependencies
on:
  push:
    paths: ['.github/workflows/dependency-snapshot.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          npm ci
          npm install --save-exact @turf/boolean-point-in-polygon@7.2.0 @turf/boolean-valid@7.2.0
          mkdir -p /tmp/gis/wheels
          pip wheel -w /tmp/gis/wheels eviltransform==0.1.1 datamodel-code-generator==0.33.0
          cp package.json package-lock.json /tmp/gis/
          tar czf /tmp/gis/node_modules.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: gis-dependencies
          path: /tmp/gis/
          retention-days: 1
