name: Public reference snapshot
on:
  push:
    paths: ['.github/workflows/reference-snapshot.yml']
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pypdf beautifulsoup4 requests
      - name: Fetch public publications
        shell: python
        run: |
          import requests, pathlib, hashlib, json
          from pypdf import PdfReader
          from bs4 import BeautifulSoup
          out = pathlib.Path('/tmp/references'); out.mkdir()
          sources = {
            'batch1': 'https://www.cacp.org.cn/zhcfg/14341.jhtml',
            'batch2': 'https://download.s21i.co99.net/24959527/0/0/ABUIABA9GAAgxY2IvwYom7uU8wY.pdf',
          }
          for name,url in sources.items():
            try:
              r=requests.get(url,timeout=120); r.raise_for_status()
              raw=r.content
              if name=='batch2':
                path=out/'batch2.pdf'; path.write_bytes(raw)
                pages=[p.extract_text() for p in PdfReader(path).pages]
                (out/'batch2-pages.json').write_text(json.dumps(pages,ensure_ascii=False))
                path.unlink()
              else:
                r.encoding='utf-8'
                (out/(name+'.txt')).write_text(BeautifulSoup(r.text,'html.parser').get_text('\n',strip=True))
              (out/(name+'-source.json')).write_text(json.dumps({'url':url,'sha256':hashlib.sha256(raw).hexdigest()},ensure_ascii=False))
            except Exception as e:
              (out/(name+'-error.txt')).write_text(str(e))
      - uses: actions/upload-artifact@v4
        with:
          name: public-reference-text
          path: /tmp/references/
          retention-days: 1
