name: PR2 reproducibility
on:
  push:
    branches: [codex/pr2-decision-dashboard]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output=/tmp/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pr2-source-${{ github.sha }}
          path: /tmp/source.tar.gz
          retention-days: 1
