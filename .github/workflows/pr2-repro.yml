name: PR2 reproducibility
on:
  push:
    branches: [codex/pr2-decision-dashboard]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip download --dest /tmp/python-wheels 'datamodel-code-generator>=0.33,<1' 'eviltransform==0.1.1' 'rank-bm25==0.2.2' 'jieba==0.42.1' 'sqlglot>=27,<31'
      - uses: actions/upload-artifact@v4
        with:
          name: pr2-python-wheels
          path: /tmp/python-wheels
          retention-days: 1
